<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#8b5cf6">
    <meta name="description" content="Sistem manajemen inventaris">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/downloadre.png">

    <title>Katalog Barang</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans antialiased text-slate-800">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-t-xl shadow-sm border-b border-gray-100 p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">📦 Katalog Barang</h1>
                <p class="text-sm text-slate-500 mt-1">Sistem manajemen inventaris</p>
                <p class="text-sm text-slate-500 mt-1">Nama: Ryan Juniarto | NIM: 231220046</p>
            </div>
            <div class="bg-emerald-100 text-emerald-600 p-3 rounded-xl hidden sm:block">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                </svg>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- FORM TAMBAH BARANG -->
        <!-- ========================================== -->
        <div class="bg-white border-b border-gray-200 p-6">
            <button id="btnTambah"
                class="bg-purple-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-purple-700 transition-all duration-200 flex items-center gap-2 shadow-md hover:shadow-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Tambah Barang
            </button>

            <!-- Form Card (Hidden by default) -->
            <div id="formTambah" class="hidden mt-4 bg-slate-50 rounded-xl p-6 border border-slate-200 shadow-inner">
                <h2 class="text-lg font-bold text-slate-700 mb-4">➕ Tambah Barang Baru</h2>

                <form id="formBarang" class="space-y-4" onsubmit="return false">
                    <!-- Nama Barang -->
                    <div>
                        <label for="nama_barang" class="block text-sm font-medium text-slate-600 mb-1">
                            Nama Barang
                        </label>
                        <input type="text" id="nama_barang" name="nama_barang" required
                            placeholder="Masukkan nama barang"
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all duration-200">
                    </div>

                    <!-- Harga -->
                    <div>
                        <label for="harga" class="block text-sm font-medium text-slate-600 mb-1">
                            Harga (Rp)
                        </label>
                        <input type="number" id="harga" name="harga" required min="0" step="100"
                            placeholder="Masukkan harga"
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all duration-200">
                    </div>

                    <!-- Tombol Aksi -->
                    <div class="flex gap-3 pt-2">
                        <button type="submit"
                            class="bg-emerald-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-emerald-700 transition-all duration-200 flex items-center gap-2 shadow-md hover:shadow-lg">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M5 13l4 4L19 7"></path>
                            </svg>
                            Simpan Barang
                        </button>

                        <button type="button" id="btnBatal"
                            class="bg-slate-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-slate-600 transition-all duration-200 flex items-center gap-2 shadow-md hover:shadow-lg">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            Batal
                        </button>
                    </div>

                    <!-- Pesan Status -->
                    <div id="pesanStatus" class="hidden"></div>
                </form>
            </div>
        </div>

        <!-- Tabel -->
        <div class="bg-white shadow-sm rounded-b-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr
                            class="bg-slate-50 text-slate-600 text-sm uppercase tracking-wider border-b border-gray-200">
                            <th class="py-4 px-6 font-semibold w-24">ID</th>
                            <th class="py-4 px-6 font-semibold">Nama Barang</th>
                            <th class="py-4 px-6 font-semibold text-right">Harga</th>
                            <th class="py-4 px-6 font-semibold text-center w-24">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-barang" class="divide-y divide-gray-100">
                        <!-- Data akan diisi oleh JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Status PWA -->
        <div class="mt-4 text-center">
            <p id="status-pwa" class="text-sm text-slate-500">
                🔄 Memuat status koneksi...
            </p>
        </div>
    </div>

    <script src="./app.js"></script>
</body>

</html>
