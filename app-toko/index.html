<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="description" content="Sistem manajemen inventaris">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/downloadre.png">
    <title>Katalog Barang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ✅ Library QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans antialiased text-slate-800">

<div class="max-w-4xl mx-auto">

    <!-- Header -->
    <div class="bg-white rounded-t-xl shadow-sm border-b border-gray-100 p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">📦 Katalog Barang</h1>
            <p class="text-sm text-slate-500 mt-1">Sistem manajemen inventaris</p>
            <p class="text-sm text-slate-500 mt-1">Nama: Ryan Juniarto | NIM: 231220046</p>
        </div>
        <div class="flex items-center gap-2 flex-wrap justify-end">
            <div class="text-right hidden sm:block">
                <p class="text-xs text-slate-400">Login sebagai</p>
                <p id="nama-user" class="text-sm font-semibold text-violet-600"></p>
            </div>
            <div class="bg-emerald-100 text-emerald-600 p-3 rounded-xl hidden sm:block">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                </svg>
            </div>
            <a href="/dashboard.html" class="bg-violet-100 text-violet-700 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-violet-200 transition-all duration-200">
                📊 Dashboard
            </a>
            <button onclick="window.open('/cetak.html', '_blank')" class="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-200 transition-all duration-200">
                🖨️ Cetak
            </button>
            <button onclick="logout()" class="bg-red-100 text-red-600 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-red-200 transition-all duration-200">
                🚪 Logout
            </button>
        </div>
    </div>

    <!-- FORM TAMBAH BARANG -->
    <div class="bg-white border-b border-gray-200 p-6">
        <button id="btnTambah"
            class="bg-purple-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-purple-700 transition-all duration-200 flex items-center gap-2 shadow-md hover:shadow-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            Tambah Barang
        </button>

        <div id="formTambah" class="hidden mt-4 bg-slate-50 rounded-xl p-6 border border-slate-200 shadow-inner">
            <h2 class="text-lg font-bold text-slate-700 mb-4">➕ Tambah Barang Baru</h2>

            <form id="formBarang" class="space-y-4" onsubmit="return false">
                <!-- Nama Barang -->
                <div>
                    <label for="nama_barang" class="block text-sm font-medium text-slate-600 mb-1">Nama Barang</label>
                    <input type="text" id="nama_barang" name="nama_barang" required
                        placeholder="Masukkan nama barang"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all duration-200">
                </div>

                <!-- Harga -->
                <div>
                    <label for="harga" class="block text-sm font-medium text-slate-600 mb-1">Harga (Rp)</label>
                    <input type="number" id="harga" name="harga" required min="0" step="100"
                        placeholder="Masukkan harga"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all duration-200">
                </div>

                <!-- Gambar -->
                <div>
                    <label for="gambar" class="block text-sm font-medium text-slate-600 mb-1">Foto Barang (opsional)</label>
                    <input type="file" id="gambar" name="gambar" accept="image/*"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none transition-all duration-200 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-purple-100 file:text-purple-700 hover:file:bg-purple-200">
                    <p class="text-xs text-slate-400 mt-1">Format: JPG, PNG, GIF, WEBP. Maks 2MB.</p>
                    <img id="previewGambar" src="" alt="Preview" class="hidden mt-3 w-32 h-32 object-cover rounded-lg border border-slate-200">
                </div>

                <!-- ✅ GPS Lokasi -->
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Lokasi Barang (opsional)</label>
                    <div class="flex items-center gap-3 flex-wrap">
                        <input type="hidden" id="latitude"  name="latitude"  value="">
                        <input type="hidden" id="longitude" name="longitude" value="">
                        <input type="hidden" id="kode_qr"   name="kode_qr"   value="">
                        <button type="button" id="btnGps" onclick="dapatkanLokasi()"
                            class="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-200 transition-all duration-200 flex items-center gap-2">
                            📍 Dapatkan Lokasi GPS
                        </button>
                        <span id="lokasi-text" class="text-xs text-slate-400">Belum ada lokasi</span>
                    </div>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit"
                        class="bg-emerald-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-emerald-700 transition-all duration-200 flex items-center gap-2 shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        Simpan Barang
                    </button>
                    <button type="button" id="btnBatal"
                        class="bg-slate-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-slate-600 transition-all duration-200 flex items-center gap-2 shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                        Batal
                    </button>
                </div>

                <div id="pesanStatus" class="hidden"></div>
            </form>
        </div>
    </div>

    <!-- Pencarian + Tombol Scan QR -->
    <div class="bg-white border-b border-gray-200 px-6 py-4 flex flex-col sm:flex-row gap-3 items-center justify-between">
        <div class="relative w-full sm:max-w-sm">
            <span class="absolute inset-y-0 left-3 flex items-center text-slate-400 pointer-events-none">🔍</span>
            <input type="text" id="inputCari" placeholder="Cari nama barang..."
                onkeyup="cariBarang(this.value)"
                class="w-full pl-9 pr-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none transition-all duration-200 text-sm">
        </div>
        <div class="flex items-center gap-3">
            <p id="info-total" class="text-sm text-slate-400 whitespace-nowrap"></p>
            <!-- ✅ Tombol Scan QR -->
            <button onclick="bukaModalQrScan('scan')"
                class="bg-violet-600 text-white px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-violet-700 transition-all duration-200 flex items-center gap-2 shadow-sm">
                📷 Scan QR
            </button>
        </div>
    </div>

    <!-- Tabel -->
    <div class="bg-white shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 text-slate-600 text-sm uppercase tracking-wider border-b border-gray-200">
                        <th class="py-4 px-6 font-semibold w-20">Foto</th>
                        <th class="py-4 px-6 font-semibold w-16">ID</th>
                        <th class="py-4 px-6 font-semibold">Nama Barang</th>
                        <th class="py-4 px-6 font-semibold text-right">Harga</th>
                        <!-- ✅ Kolom Lokasi -->
                        <th class="py-4 px-6 font-semibold text-center">Lokasi</th>
                        <th class="py-4 px-6 font-semibold text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabel-barang" class="divide-y divide-gray-100">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Navigasi Halaman -->
    <div class="bg-white rounded-b-xl shadow-sm border-t border-gray-100 px-6 py-4 flex items-center justify-between">
        <button id="btnPrev" onclick="gantiHalaman(-1)" disabled
            class="flex items-center gap-2 bg-slate-100 text-slate-600 px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-purple-100 hover:text-purple-700 transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed">
            ◀ Prev
        </button>
        <span id="info-halaman" class="text-sm text-slate-500 font-medium">Halaman 1 / 1</span>
        <button id="btnNext" onclick="gantiHalaman(1)" disabled
            class="flex items-center gap-2 bg-slate-100 text-slate-600 px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-purple-100 hover:text-purple-700 transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed">
            Next ▶
        </button>
    </div>

    <!-- Status PWA -->
    <div class="mt-4 text-center">
        <p id="status-pwa" class="text-sm text-slate-500">🔄 Memuat status koneksi...</p>
    </div>
</div>

<!-- ======================================= -->
<!-- ✅ MODAL QR SCANNER                     -->
<!-- ======================================= -->
<div id="modalQr" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">

        <!-- Header Modal -->
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
            <h3 class="font-bold text-slate-700 text-lg">📷 QR Scanner Gudang</h3>
            <button onclick="tutupModalQr()"
                class="text-slate-400 hover:text-slate-700 text-2xl font-bold leading-none transition-colors">
                ✕
            </button>
        </div>

        <!-- Area Kamera -->
        <div id="qr-reader" class="w-full bg-black min-h-[250px]"></div>

        <!-- ✅ Area Status: 3 kondisi (loading / ditemukan / tidak ditemukan) -->
        <div id="qr-status" class="p-4">
            <!-- Diisi oleh tampilQrStatus() -->
        </div>

    </div>
</div>

<script src="./app.js"></script>
</body>
</html>
